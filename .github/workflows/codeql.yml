name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            glob: "**/*.py"
          - language: javascript-typescript
            glob: "frontend/**"
    steps:
      - uses: actions/checkout@v4
      # CodeQL fails when a language has no source files; skip until code exists.
      - uses: github/codeql-action/init@v3
        if: hashFiles(matrix.glob) != ''
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
        if: hashFiles(matrix.glob) != ''
        with:
          category: "/language:${{ matrix.language }}"
